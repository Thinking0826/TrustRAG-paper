<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="116.769444mm" viewBox="0 0 518.740157 331" font-family="Helvetica">
<title>Selection, dependency closure, and matched ordering</title>
<desc>A fictional source folio feeds two matched packing paths. Independent density proposes S2 alone; dependency closure proposes the mutual list group S1, S2 and S3. Both paths use the same utilities and complete-input token limit, and copy admitted original source slices without rewriting. Separate diagnostic contrasts replace retrieved excerpts with whole human-annotated paragraphs in the QASPER oracle, or retain exactly the same selected chunks and change only their order in LongBench. The units and drawings are illustrative; they do not encode measured outcomes.</desc>
